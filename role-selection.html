<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Role | Hostel Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        h1 {
            color: #0f172a;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 35px;
        }

        .roles {
            display: flex;
            gap: 25px;
            justify-content: center;
        }

        .card {
            flex: 1;
            background: white;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }

        .icon {
            font-size: 45px;
            margin-bottom: 15px;
        }

        h2 {
            color: #1e293b;
        }

        .card p {
            color: #64748b;
            line-height: 1.6;
            min-height: 50px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .hosteller-button {
            background: #0d9488;
        }

        .hosteller-button:hover {
            background: #0f766e;
        }

        .owner-button {
            background: #2563eb;
        }

        .owner-button:hover {
            background: #1d4ed8;
        }

        @media (max-width: 600px) {
            .roles {
                flex-direction: column;
            }

            .card p {
                min-height: auto;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Hostel Management System</h1>

        <p class="subtitle">
            Welcome! Please select your role to continue.
        </p>

        <div class="roles">
            <div class="card">
                <div class="icon">🎓</div>
                <h2>Hosteller</h2>
                <p>View your room, rent, payments, complaints and hostel updates.</p>

                <button class="hosteller-button"
                    onclick="chooseRole('hosteller')">
                    Continue as Hosteller
                </button>
            </div>

            <div class="card">
                <div class="icon">🏢</div>
                <h2>Owner</h2>
                <p>Manage hostel rooms, hostellers, complaints and announcements.</p>

                <button class="owner-button"
                    onclick="chooseRole('owner')">
                    Continue as Owner
                </button>
            </div>
        </div>
    </div>

    <script>
        function chooseRole(role) {
            sessionStorage.setItem("selectedRole", role);
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
